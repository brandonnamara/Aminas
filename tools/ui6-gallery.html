<!-- Phase 6: combat interface, prismatic icons and unified rewards, rendered by the game's own code and stylesheets
     (no copies): the page loads every game script except the boot, builds real battles, result cards and reward
     cards off-screen, and shows them here in their states. Open over the dev server: /tools/ui6-gallery.html. -->
<link rel="stylesheet" href="src/style.css">
<link rel="stylesheet" href="src/ui-prism.css">

<style>
  html, body { position: static; overflow: auto; height: auto; -webkit-user-select: text; user-select: text; }
  body { background: radial-gradient(120% 90% at 30% 0%, #3a2c7e, #120e2e 70%); padding: 1rem 1.2rem 2rem; font-size: 15px; }
  #app { position: fixed; left: -4000px; top: 0; width: 844px; height: 390px; visibility: hidden; }
  #rotate { display: none !important; }
  h1.g { font-size: 1.3rem; margin: 0 0 .2rem; background: linear-gradient(180deg, #fffaf0, #ffd978 60%, #ffb6e6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .g-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem; }
  .g-sec { display: block; padding: .7rem .8rem .8rem; }
  .g-sec.wide { grid-column: 1 / -1; }
  .g-sec > b { display: block; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--pz-gold); margin-bottom: .45rem; }
  .g-row { display: flex; flex-wrap: wrap; gap: .55rem; align-items: flex-start; margin: .35rem 0; }
  .g-cap { font-size: .62rem; color: var(--pz-muted); text-align: center; margin-top: .2rem; max-width: 14rem; }
  .g-it { display: flex; flex-direction: column; align-items: center; }
  .g-ic { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.2rem, 1fr)); gap: .4rem; }
  .g-ic > div { text-align: center; font-size: .6rem; color: var(--pz-muted); padding: .35rem .1rem; background: rgba(10, 6, 30, .3); }
  .g-ic .ico { width: 2rem; height: 2rem; display: block; margin: 0 auto .2rem; }
  .g-cat { font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: #cfc6ee; margin: .6rem 0 .25rem; }
  .g-sec .b-panel, .g-sec .b-turn, .g-sec .b-tip { position: relative !important; left: auto !important; top: auto !important; bottom: auto !important; transform: none !important; }
  .g-sec .b-panel.fp { width: 12.5rem; }
  .g-sec .abtn { width: 13rem; }
  .g-sec .b-actions { position: static; width: 27rem; }
  .g-sec .float { position: relative !important; left: auto !important; top: auto !important; animation: none !important; transform: none !important; }
  .g-sec .sheet { position: relative; max-height: none; width: 30rem; animation: none; margin: 0; }
  .g-sec .sheet .sh-body { max-height: none; overflow: visible; }
  .g-sec .reward-card { animation: none; filter: none; width: 22rem; }
  .g-sec .rtile, .g-sec .rtile::after { animation: none !important; }
  .g-sec .vcard.reveal { width: 18rem; }
  .g-fit { display: flex; gap: .8rem; flex-wrap: wrap; align-items: flex-start; }
  .g-dark { background: #2a2062; padding: .5rem; }
</style>
</head>

<h1 class="g">Aminas · Phase 6 · Combat, icons and rewards</h1>
