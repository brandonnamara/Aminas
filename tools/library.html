<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aminas Environment Library</title>
<style>
  :root { --bg: #eef3ea; --ink: #2b2147; --muted: #6a6488; --card: #ffffffcc; }
  html, body { margin: 0; height: 100%; background: var(--bg); font: 600 13px/1.3 system-ui, -apple-system, Segoe UI, sans-serif; color: var(--ink); }
  #bar { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: #2b2147; color: #fff; z-index: 2; }
  #bar b { margin-right: 8px; } #bar button { font: inherit; border: 0; border-radius: 6px; padding: 5px 9px; background: #4b3f7a; color: #fff; cursor: pointer; } #bar button.on { background: #ffd86b; color: #2b2147; }
  #bar label { margin-left: auto; display: flex; gap: 4px; align-items: center; font-weight: 500; }
  #stage { position: fixed; inset: 0; } #stage canvas { display: block; }
  .lab { position: absolute; transform: translate(-50%, 0); background: var(--card); padding: 2px 7px; border-radius: 6px; white-space: nowrap; pointer-events: none; font-size: 12px; }
  .lab small { display: block; font-weight: 500; color: var(--muted); font-size: 10.5px; }
  .lab .st { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 4px; font-size: 10px; color: #fff; }
  .st.in-game { background: #3f9a4a; } .st.library { background: #3f7cc8; } .st.demo { background: #a8338a; }
  body.plate #bar { display: none; } body.plate .lab small { display: none; }
</style></head>
<body>
<div id="bar"><b>Aminas environment library</b><span id="cats"></span><label><input type="checkbox" id="lod"> mobile LOD</label></div>
<div id="stage"></div>
<script type="module" src="library.js"></script>
</body></html>
